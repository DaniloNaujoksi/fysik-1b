<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fysik 1b Fortsättning — Williams Fysiklabb ⚛️</title>
  <meta name="description" content="Interaktiv plugghjälp för Fysik 1b fortsättning — simuleringar, quiz och dåliga fysikskämt. Auch auf Deutsch.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stars"></div>

  <button id="lang-switch" aria-label="Sprache wechseln / Byt språk">🇩🇪 Deutsch</button>

  <header>
    <div class="header-inner">
      <h1>⚛️ <span data-s="siteTitle"></span></h1>
      <p class="subtitle" data-s="siteSub"></p>
      <div class="xp-bar-wrap">
        <div class="xp-info">
          <span id="level-title"></span>
          <span id="xp-count"></span>
        </div>
        <div class="xp-bar"><div id="xp-fill"></div></div>
      </div>
    </div>
  </header>

  <nav id="module-nav" aria-label="Moduler"></nav>

  <main id="content">
    <section id="welcome" class="active"></section>
  </main>

  <div id="toast" role="status"></div>
  <canvas id="confetti-canvas"></canvas>

  <footer>
    <p data-s="footer"></p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
